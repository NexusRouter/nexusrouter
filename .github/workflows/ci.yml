name: Project Checks (CLA + Code Quality)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cla-check:
    name: CLA Signature Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check if contributor signed CLA
        # contributor-assistant/github-action (formerly cla-assistant); pin semver, not @v2.
        uses: contributor-assistant/github-action@v2.6.1
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/NexusRouter/cla/blob/main/CLA.md'
          branch: main
          allowlist: dependabot[bot]
          remote-organization-name: NexusRouter
          remote-repository-name: cla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needs repo scope to write signatures into NexusRouter/cla (and comment on PRs if default token is insufficient).
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_TOKEN }}

  code-quality:
    name: Code & Spec Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate OpenSpec specs
        run: openspec validate --all --no-interactive

      - name: Superpowers code quality check
        run: |
          npx superpowers lint
          npx superpowers format --check
