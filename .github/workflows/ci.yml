name: Project Checks (CLA + Code Quality)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Remote signatures (NexusRouter/cla) require repo secret CLA_ASSISTANT_TOKEN (mapped to PERSONAL_ACCESS_TOKEN below).
  cla-check:
    name: CLA Signature Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check if contributor signed CLA
        # contributor-assistant/github-action (formerly cla-assistant); pin semver, not @v2.
        uses: contributor-assistant/github-action@v2.6.1
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/NexusRouter/cla/blob/main/CLA.md'
          branch: main
          allowlist: dependabot[bot]
          remote-organization-name: NexusRouter
          remote-repository-name: cla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needs repo scope to write signatures into NexusRouter/cla (and comment on PRs if default token is insufficient).
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_TOKEN }}

  gateway-go:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum

      - name: Go fmt
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1

      - name: Go build
        run: go build -o /tmp/nexusrouter-gateway .

  code-quality:
    name: Code & Spec Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate OpenSpec specs
        run: openspec validate --all --no-interactive
