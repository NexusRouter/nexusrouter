name: Project Checks (Code Quality)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gateway-go:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum

      - name: Set up Node.js (swagger2openapi → OAS3)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Go fmt
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Verify Swag docs drift
        run: make docs && git diff --exit-code docs/ internal/openapi/openapi.yaml

      - name: Go test
        run: go test ./... -count=1 -cover

      - name: Go build API
        run: go build -o /tmp/nexusrouter-gateway ./cmd/api

  dashboard-frontend:
    name: Dashboard (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test (with coverage)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  code-quality:
    name: Code & Spec Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate OpenSpec specs
        run: openspec validate --all --no-interactive
