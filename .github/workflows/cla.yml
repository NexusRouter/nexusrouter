name: CLA

# Upstream recommends pull_request_target (base repo context) + issue_comment for recheck/sign;
# plain pull_request can mis-resolve PR number for this action in some cases.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    name: CLA Signature Check
    runs-on: ubuntu-latest
    steps:
      - name: Check if contributor signed CLA
        if: (github.event_name == 'issue_comment' && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/NexusRouter/cla/blob/main/CLA.md'
          branch: main
          allowlist: dependabot[bot]
          remote-organization-name: NexusRouter
          remote-repository-name: cla
          lock-pullrequest-aftermerge: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_TOKEN }}
