basePath: /
definitions:
  handler.ChatCompletionRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/handler.ChatMessage'
        type: array
      model:
        example: gpt-4o-mini
        type: string
      stream:
        type: boolean
    type: object
  handler.ChatCompletionResponse:
    properties:
      created:
        type: integer
      id:
        example: chatcmpl-xxx
        type: string
      model:
        type: string
      object:
        example: chat.completion
        type: string
    type: object
  handler.ChatMessage:
    properties:
      content:
        example: hello
        type: string
      role:
        example: user
        type: string
    type: object
  handler.GatewayErrorBody:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: 凭证无效或缺失
        type: string
      request_id:
        example: a1b2c3d4e5f6g7h8
        type: string
    type: object
  handler.HealthResponse:
    properties:
      server_time:
        example: "2026-05-01T12:00:00.000000001Z"
        type: string
      status:
        example: ok
        type: string
      version:
        example: dev
        type: string
    type: object
  handler.SetActiveUpstreamBody:
    properties:
      active_upstream_id:
        type: string
    type: object
externalDocs:
  description: OpenAI API Overview
  url: https://developers.openai.com/api/reference/overview
host: localhost:8080
info:
  contact: {}
  description: OpenAI 兼容 Chat Completions 网关。REST 概览与认证约定参见 https://developers.openai.com/api/reference/overview
  title: NexusRouter Gateway API
  version: 1.0.0
paths:
  /health:
    get:
      description: 返回服务状态、版本号与当前时间（UTC RFC3339Nano），无需鉴权。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: 健康检查
      tags:
      - system
  /internal/reload-config:
    post:
      description: 需携带与 NEXUSROUTER_ADMIN_RELOAD_TOKEN 相同的 Bearer；失败时保留旧快照。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 热加载网关配置文件
      tags:
      - admin
  /internal/reload-keys:
    post:
      description: 需携带与 NEXUSROUTER_ADMIN_RELOAD_TOKEN 相同的 Bearer 管理令牌；成功时重新读取密钥 JSON。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 热加载 API 密钥文件
      tags:
      - admin
  /internal/upstream/active:
    put:
      consumes:
      - application/json
      description: 传空字符串可解除 pin；需 Bearer 管理令牌。
      parameters:
      - description: active_upstream_id 可为空表示解除 pin
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SetActiveUpstreamBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 固定当前上游 id
      tags:
      - admin
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      description: 与 OpenAI Chat Completions 兼容子集；官方概览 https://developers.openai.com/api/reference/overview
      parameters:
      - description: 可选，与 Bearer 二选一
        in: header
        name: X-API-Key
        type: string
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ChatCompletionRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ChatCompletionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.GatewayErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handler.GatewayErrorBody'
      security:
      - BearerAuth: []
      summary: Chat Completions
      tags:
      - chat
securityDefinitions:
  BearerAuth:
    description: Bearer 令牌，与 OpenAI 一致（见官方概览）。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
