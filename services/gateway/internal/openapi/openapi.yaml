openapi: 3.0.3
info:
  title: NexusRouter Gateway API
  version: "1.0.0"
  description: |
    OpenAI 兼容 Chat Completions 网关。官方 REST 概览与认证约定见 https://developers.openai.com/api/reference/overview
externalDocs:
  description: OpenAI API Overview
  url: https://developers.openai.com/api/reference/overview
servers:
  - url: /
    description: 当前网关（相对本服务根路径）
security:
  - bearerAuth: []
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Chat Completions
      description: 与 OpenAI Chat Completions 子集兼容；请求体为 JSON，响应可为 JSON 或 text/event-stream。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 成功；非流式时为 application/json，流式时为 text/event-stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "401":
          description: 网关鉴权失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: 上游不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "504":
          description: 上游超时
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
