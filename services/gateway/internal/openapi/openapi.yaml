openapi: 3.0.0
externalDocs:
  description: OpenAI API Overview
  url: https://developers.openai.com/api/reference/overview
info:
  contact: {}
  description: OpenAI 兼容 Chat Completions 网关。REST 概览与认证约定参见
    https://developers.openai.com/api/reference/overview
  title: NexusRouter Gateway API
  version: 1.0.0
paths:
  /v1/chat/completions:
    post:
      description: 与 OpenAI Chat Completions 兼容子集；官方概览
        https://developers.openai.com/api/reference/overview
      parameters:
        - description: 可选，与 Bearer 二选一
          in: header
          name: X-API-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.ChatCompletionRequest"
        description: 请求体
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.ChatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/handler.ChatCompletionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
            text/event-stream:
              schema:
                additionalProperties:
                  type: string
                type: object
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
            text/event-stream:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Chat Completions
      tags:
        - chat
servers:
  - url: //localhost:8080/
components:
  securitySchemes:
    BearerAuth:
      description: Bearer 令牌，与 OpenAI 一致（见官方概览）。
      in: header
      name: Authorization
      type: apiKey
  schemas:
    handler.ChatCompletionRequest:
      properties:
        messages:
          items:
            $ref: "#/components/schemas/handler.ChatMessage"
          type: array
        model:
          example: gpt-4o-mini
          type: string
        stream:
          type: boolean
      type: object
    handler.ChatCompletionResponse:
      properties:
        created:
          type: integer
        id:
          example: chatcmpl-xxx
          type: string
        model:
          type: string
        object:
          example: chat.completion
          type: string
      type: object
    handler.ChatMessage:
      properties:
        content:
          example: hello
          type: string
        role:
          example: user
          type: string
      type: object
