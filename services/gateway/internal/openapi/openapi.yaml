openapi: 3.0.0
externalDocs:
  description: OpenAI API Overview
  url: https://developers.openai.com/api/reference/overview
info:
  contact: {}
  description: OpenAI 兼容 Chat Completions 网关。REST 概览与认证约定参见
    https://developers.openai.com/api/reference/overview
  title: NexusRouter Gateway API
  version: 1.0.0
paths:
  /api/bootstrap/v1/complete:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.firstBootCompleteBody"
        description: 初始化载荷
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: 完成首次初始化
  /api/bootstrap/v1/reset:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      security:
        - BearerAuth: []
      summary: 重置首次初始化（超级管理员）
  /api/bootstrap/v1/status:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: 首次初始化状态
  /health:
    get:
      description: 返回服务状态、版本号与当前时间（UTC RFC3339Nano），无需鉴权。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.HealthResponse"
      summary: 健康检查
      tags:
        - system
  /internal/reload-config:
    post:
      description: 需携带与 NEXUSROUTER_ADMIN_RELOAD_TOKEN 相同的 Bearer；失败时保留旧快照。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: 热加载网关配置文件
      tags:
        - admin
  /internal/reload-keys:
    post:
      description: 需携带与 NEXUSROUTER_ADMIN_RELOAD_TOKEN 相同的 Bearer 管理令牌；成功时重新读取密钥 JSON。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: 热加载 API 密钥文件
      tags:
        - admin
  /internal/upstream/active:
    put:
      description: 传空字符串可解除 pin；需 Bearer 管理令牌。
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.SetActiveUpstreamBody"
        description: active_upstream_id 可为空表示解除 pin
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: 固定当前上游 id
      tags:
        - admin
  /v1/models:
    get:
      description: 列出当前网关已发布模型（OpenAI List models 子集）；需网关 API Key。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpenAIModelItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.GatewayErrorBody"
      security:
        - BearerAuth: []
      summary: List models
      tags:
        - chat
  /v1/models/{model}:
    get:
      description: 检索单个已发布模型元数据。
      parameters:
        - in: path
          name: model
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIModelItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.GatewayErrorBody"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.GatewayErrorBody"
      security:
        - BearerAuth: []
      summary: Retrieve model
      tags:
        - chat
  /v1/chat/completions:
    post:
      description: 与 OpenAI Chat Completions 兼容子集；官方概览
        https://developers.openai.com/api/reference/overview
      parameters:
        - description: 可选，与 Bearer 二选一
          in: header
          name: X-API-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.ChatCompletionRequest"
        description: 请求体
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.ChatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/handler.ChatCompletionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.GatewayErrorBody"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/handler.GatewayErrorBody"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.GatewayErrorBody"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/handler.GatewayErrorBody"
      security:
        - BearerAuth: []
      summary: Chat Completions
      tags:
        - chat
servers:
  - url: //localhost:8080/
components:
  securitySchemes:
    BearerAuth:
      description: Bearer 令牌，与 OpenAI 一致（见官方概览）。
      in: header
      name: Authorization
      type: apiKey
  schemas:
    OpenAIModelItem:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
          format: int64
        owned_by:
          type: string
    handler.ChatCompletionRequest:
      properties:
        messages:
          items:
            $ref: "#/components/schemas/handler.ChatMessage"
          type: array
        model:
          example: gpt-4o-mini
          type: string
        stream:
          type: boolean
      type: object
    handler.ChatCompletionResponse:
      properties:
        created:
          type: integer
        id:
          example: chatcmpl-xxx
          type: string
        model:
          type: string
        object:
          example: chat.completion
          type: string
      type: object
    handler.ChatMessage:
      properties:
        content:
          example: hello
          type: string
        role:
          example: user
          type: string
      type: object
    handler.GatewayErrorBody:
      properties:
        code:
          example: UNAUTHORIZED
          type: string
        message:
          example: 凭证无效或缺失
          type: string
        request_id:
          example: a1b2c3d4e5f6g7h8
          type: string
      type: object
    handler.HealthResponse:
      properties:
        server_time:
          example: 2026-05-01T12:00:00.000000001Z
          type: string
        status:
          example: ok
          type: string
        version:
          example: dev
          type: string
      type: object
    handler.SetActiveUpstreamBody:
      properties:
        active_upstream_id:
          type: string
      type: object
    handler.firstBootCompleteBody:
      properties:
        admin_password:
          type: string
        admin_username:
          type: string
        site_display_name:
          type: string
      type: object
